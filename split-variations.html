<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You Focus On / We Handle — 6 Variations</title>
<style>
@font-face{font-family:'Manrope WL';font-weight:200 800;font-display:swap;src:url(https://welabs.dev/fonts/Manrope-variable-latin.woff2) format('woff2')}
@font-face{font-family:'Geist WL';font-weight:100 900;font-display:swap;src:url(https://welabs.dev/fonts/Geist-variable-latin.woff2) format('woff2')}
@font-face{font-family:'Plex WL';font-weight:400;font-display:swap;src:url(https://welabs.dev/fonts/IBMPlexMono-400-latin.woff2) format('woff2')}
@font-face{font-family:'Plex WL';font-weight:500;font-display:swap;src:url(https://welabs.dev/fonts/IBMPlexMono-500-latin.woff2) format('woff2')}
:root{--ink:#111B3A;--ink2:#3A4566;--muted:#4A5268;--soft:#5E6680;--line:#E6E8EF;--bg:oklch(0.966 0.011 259);--bg2:oklch(0.985 0.008 262);
  --blue:oklch(0.52 0.19 262);--blue-soft:oklch(0.955 0.025 262);--lb:oklch(0.75 0.13 259);--ease:cubic-bezier(.22,.61,.36,1)}
*{box-sizing:border-box}
body{margin:0;background:#FFFFFF;color:var(--ink);font-family:'Geist WL',sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
h2,h3,h4{font-family:'Manrope WL',sans-serif;margin:0;color:var(--ink)}
p{margin:0} ul{list-style:none;margin:0;padding:0}
svg{flex:none}
.wrap{max-width:1560px;margin:0 auto;padding:0 32px}
.top{padding:96px 0 24px;text-align:center}
.top .eb,.lab{font-family:'Plex WL',monospace;font-size:13px;font-weight:500;letter-spacing:.01em;color:var(--blue)}
.top h1{margin:16px 0 0;font-family:'Manrope WL',sans-serif;font-size:clamp(28px,3.2vw,48px);line-height:1.08;letter-spacing:-.032em;font-weight:700}
.top h1 span{display:block;font-weight:300;color:var(--ink2)}
.top p{margin:18px auto 0;max-width:640px;font-size:18px;color:var(--muted)}
.var{padding:72px 0}
.var+.var{border-top:1px solid var(--line)}
.vh{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:28px}
.vh b{font-family:'Manrope WL',sans-serif;font-size:24px;font-weight:700;letter-spacing:-.02em}
.vh span{font-size:15px;color:var(--soft)}
/* shared bits */
.tag{font-family:'Plex WL',monospace;font-size:13px;font-weight:400;letter-spacing:.01em;color:var(--soft)}
.dark .tag,.tag.lb{color:var(--lb)}
h3.t{margin-top:10px;font-size:20px;line-height:1.5;font-weight:700;letter-spacing:-.015em}
.dark h3.t,.dark h3{color:#FFFFFF}
.ck{width:16px;height:16px;margin-top:3px}
.li{display:flex;gap:12px;font-size:15.5px;line-height:1.45}
.dark .li{color:#E3E8FB}
.dark{background:var(--ink);color:#FFFFFF;position:relative;overflow:hidden}
.glow::before{content:"";position:absolute;width:560px;height:560px;right:-180px;top:-220px;border-radius:50%;background:radial-gradient(closest-side,oklch(0.52 0.19 262 / .55),transparent);filter:blur(20px);pointer-events:none;transition:transform .8s var(--ease)}
.glow:hover::before{transform:translate(-80px,60px)}
.dark>*{position:relative}
.ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--blue-soft);color:var(--blue);transition:transform .4s var(--ease)}
.ic svg{width:19px;height:19px}
.dark .ic{background:rgba(255,255,255,.08);color:var(--lb)}
.card{border:1px solid var(--line);border-radius:24px;background:#FFFFFF;transition:border-color .3s,translate .35s var(--ease)}
@media (hover:hover){.lift:hover{translate:0 -4px;border-color:#CFD4E0}}

/* V1 — stacked bands */
.v1{display:grid;gap:12px}
.v1 .you{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:24px 48px;padding:28px 40px;border-radius:24px;background:var(--bg)}
.v1 .you ul{display:flex;flex-wrap:wrap;gap:10px}
.v1 .you li{padding:10px 16px 10px 12px;border-radius:999px;background:#FFFFFF;border:1px solid var(--line)}
.v1 .we{border-radius:24px;padding:48px}
.v1 .we ul{margin-top:32px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.v1 .we li{padding:22px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);flex-direction:column;gap:14px;transition:background-color .3s}
.v1 .we li:hover{background:rgba(255,255,255,.09)}

/* V2 — two equal halves with a hand-off node */
.v2{display:grid;grid-template-columns:minmax(0,1fr) 72px minmax(0,1fr);align-items:stretch}
.v2 .you,.v2 .we{border-radius:24px;padding:44px;display:flex;flex-direction:column}
.v2 .you{background:var(--bg)}
.v2 ul{margin-top:28px;display:grid;gap:12px}
.v2 .we ul{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px}
.v2 .node{display:flex;align-items:center;justify-content:center;position:relative}
.v2 .node::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed #CFD4E0}
.v2 .node i{position:relative;width:56px;height:56px;border-radius:50%;background:#FFFFFF;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--blue);transition:rotate .5s var(--ease)}
.v2:hover .node i{rotate:180deg}
.v2 .node svg{width:22px;height:22px}

/* V3 — headline left, 3×2 tile grid right */
.v3{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr);gap:20px}
.v3 .you{border-radius:24px;padding:40px;background:var(--bg);display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.v3 .you ul{display:grid;gap:12px}
.v3 .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.v3 .head{grid-column:1/-1;border-radius:20px;padding:28px 32px}
.v3 .tile{border-radius:20px;padding:24px;background:var(--ink);color:#E3E8FB;display:flex;flex-direction:column;gap:20px;justify-content:space-between;min-height:170px;font-size:15.5px;line-height:1.45;transition:background-color .3s,translate .35s var(--ease)}
.v3 .tile .ic{background:rgba(255,255,255,.08);color:var(--lb)}
.v3 .tile:hover{background:#18244A;translate:0 -4px}
.v3 .tile:hover .ic{transform:rotate(-8deg) scale(1.08)}

/* V4 — single dark card, diagonal light panel */
.v4{border-radius:28px;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.6fr);min-height:420px}
.v4 .you{position:relative;padding:48px 72px 48px 48px;background:var(--bg);clip-path:polygon(0 0,100% 0,82% 100%,0 100%);display:flex;flex-direction:column;justify-content:center;color:var(--ink)}
.v4 .you h3{color:var(--ink)} .v4 .you .tag{color:var(--soft)} .v4 .you .li{color:var(--ink)}
.v4 .you ul{margin-top:24px;display:grid;gap:12px}
.v4 .we{padding:48px 56px 48px 24px;display:flex;flex-direction:column;justify-content:center}
.v4 .we ol{margin:28px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:32px;counter-reset:n}
.v4 .we ol li{counter-increment:n;display:flex;gap:16px;align-items:baseline;padding:14px 0;border-top:1px solid rgba(255,255,255,.12);font-size:15.5px;color:#E3E8FB;transition:padding-left .3s var(--ease)}
.v4 .we ol li::before{content:counter(n,decimal-leading-zero);font-family:'Plex WL',monospace;font-size:12px;color:var(--lb)}
.v4 .we ol li:hover{padding-left:8px}

/* V5 — hub: you on the left, six spokes around "We Handle" */
.v5{display:grid;grid-template-columns:minmax(0,.75fr) minmax(0,1.5fr);gap:20px;align-items:stretch}
.v5 .you{border-radius:24px;padding:40px;background:var(--bg);display:flex;flex-direction:column;justify-content:center}
.v5 .you ul{margin-top:24px;display:grid;gap:12px}
.v5 .hub{border-radius:24px;padding:40px;display:grid;grid-template-columns:minmax(0,1fr) 260px minmax(0,1fr);align-items:center;gap:16px}
.v5 .col{display:grid;gap:12px}
.v5 .col .li{padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);align-items:center;transition:background-color .3s,translate .35s var(--ease)}
.v5 .col.l .li{flex-direction:row-reverse;text-align:right}
.v5 .col .li:hover{background:rgba(255,255,255,.1)}
.v5 .col.l .li:hover{translate:-4px 0} .v5 .col.r .li:hover{translate:4px 0}
.v5 .core{aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,255,255,.14);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;position:relative}
.v5 .core::before{content:"";position:absolute;inset:16%;border-radius:50%;border:1px dashed rgba(185,195,227,.35);animation:spin 30s linear infinite}
.v5 .core h3{font-size:20px;line-height:1.3;margin-top:8px}
@keyframes spin{to{rotate:360deg}}

/* V6 — two-column comparison list with a centre spine */
.v6{border-radius:28px;padding:16px;background:var(--bg)}
.v6 .heads{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px}
.v6 .heads>div{border-radius:20px;padding:32px 36px}
.v6 .heads .y{background:#FFFFFF}
.v6 .rows{margin-top:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px}
.v6 .rows ul{display:grid;gap:10px;align-content:start}
.v6 .rows .li{padding:16px 18px;border-radius:14px;background:#FFFFFF;border:1px solid var(--line);align-items:center;transition:border-color .3s,translate .35s var(--ease)}
.v6 .rows .w .li{background:var(--ink);color:#E3E8FB;border-color:var(--ink)}
.v6 .rows .w{grid-template-columns:repeat(2,minmax(0,1fr))}
.v6 .rows .li:hover{translate:0 -3px;border-color:#CFD4E0}

/* responsive */

/* V7 — big words */
.v7{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:16px}
.v7>div{border-radius:24px;padding:40px 44px;display:flex;flex-direction:column;gap:20px}
.v7 .you{background:var(--bg)}
.v7 .word{font-family:'Manrope WL',sans-serif;font-size:clamp(64px,7vw,112px);line-height:.9;letter-spacing:-.05em;font-weight:300;color:var(--ink2)}
.v7 .we .word{font-weight:800;color:#FFFFFF}
.v7 ul{display:grid;gap:12px}.v7 .we ul{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px}
/* V8 — one table, dark column */
.v8{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border:1px solid var(--line);border-radius:24px;overflow:hidden}
.v8 .col{display:flex;flex-direction:column}
.v8 .hd{padding:28px 32px;border-bottom:1px solid var(--line)}
.v8 .row{display:flex;align-items:center;gap:14px;padding:18px 32px;border-bottom:1px solid var(--line);font-size:15.5px;min-height:62px;transition:background-color .25s}
.v8 .row:last-child{border-bottom:0}
.v8 .you .row:hover{background:var(--bg2)}
.v8 .we{background:var(--ink)}
.v8 .we .hd,.v8 .we .row{border-color:rgba(255,255,255,.1)}
.v8 .we .row{color:#E3E8FB}.v8 .we .row:hover{background:#18244A}
.v8 .row.empty{color:#B3BACB}
/* V9 — layered cards */
.v9{position:relative;padding:0 0 40px 0;min-height:460px}
.v9 .you{width:46%;border-radius:24px;padding:40px;background:var(--bg);min-height:400px}
.v9 .you ul{margin-top:24px;display:grid;gap:12px}
.v9 .we{position:absolute;right:0;top:40px;width:62%;border-radius:24px;padding:44px;transition:translate .4s var(--ease)}
.v9:hover .we{translate:-12px -8px}
.v9 .we ul{margin-top:26px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 24px}
/* V10 — counts */
.v10{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:16px}
.v10>div{border-radius:24px;padding:40px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 32px;align-items:start}
.v10 .you{background:var(--bg)}
.v10 .num{grid-row:span 2;font-family:'Manrope WL',sans-serif;font-size:clamp(80px,8vw,128px);line-height:.85;letter-spacing:-.06em;font-weight:800;color:var(--blue)}
.v10 .we .num{color:var(--lb)}
.v10 ul{display:grid;gap:12px;margin-top:8px}.v10 .we ul{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px}
@media (max-width:1100px){.v7,.v10{grid-template-columns:minmax(0,1fr)}.v9 .you{width:100%;min-height:0}.v9 .we{position:relative;top:auto;width:auto;margin:-24px 0 0 24px}.v9{min-height:0;padding:0}}
@media (max-width:760px){.v7>div,.v10>div{padding:28px 22px}.v7 .we ul,.v10 .we ul,.v9 .we ul,.v8{grid-template-columns:minmax(0,1fr)}.v9 .we{margin:-16px 0 0 12px;padding:28px 22px}.v10>div{grid-template-columns:minmax(0,1fr)}.v10 .num{grid-row:auto}}
@media (max-width:1100px){
  .v1 .we ul{grid-template-columns:repeat(2,minmax(0,1fr))}
  .v2{grid-template-columns:minmax(0,1fr);gap:0}
  .v2 .node{height:64px}.v2 .node::before{left:50%;right:auto;top:0;bottom:0;border-top:0;border-left:1px dashed #CFD4E0}
  .v3,.v5{grid-template-columns:minmax(0,1fr)}
  .v4{grid-template-columns:minmax(0,1fr)}
  .v4 .you{clip-path:polygon(0 0,100% 0,100% 88%,0 100%);padding:40px 40px 64px}
  .v4 .we{padding:32px 40px 48px}
  .v5 .hub{grid-template-columns:minmax(0,1fr) 220px minmax(0,1fr)}
}
@media (max-width:760px){
  .wrap{padding:0 20px}
  .var{padding:56px 0}
  .vh{flex-direction:column;gap:4px}
  .v1 .you{grid-template-columns:minmax(0,1fr);padding:26px 22px}
  .v1 .we,.v2 .you,.v2 .we,.v3 .you,.v5 .you,.v5 .hub{padding:28px 22px}
  .v1 .we ul,.v2 .we ul,.v3 .grid,.v4 .we ol,.v6 .heads,.v6 .rows,.v6 .rows .w{grid-template-columns:minmax(0,1fr)}
  .v3 .tile{min-height:0}
  .v4 .you{padding:32px 22px 56px}.v4 .we{padding:24px 22px 36px}
  .v5 .hub{grid-template-columns:minmax(0,1fr)}
  .v5 .core{order:-1;width:220px;justify-self:center}
  .v5 .col.l .li{flex-direction:row;text-align:left}
  .v6 .heads>div{padding:24px 22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<header class="top wrap">
  <div class="eb">Sound Familiar? · Section card</div>
  <h1>You Focus On / We Handle<span>Ten Layout Variations</span></h1>
  <p>Same content and type in each. Tell me which number to use.</p>
</header>
<main class="wrap" id="v"></main>
<script>
(function () {
  var I = {
    check: '<path d="M20 6 9 17l-5-5"/>',
    users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    trend: '<path d="m3 17 6-6 4 4 8-8"/><path d="M14 7h7v7"/>',
    coin: '<circle cx="12" cy="12" r="9"/><path d="M14.5 9.5a2.5 2 0 0 0-2.5-1.5c-1.4 0-2.5.8-2.5 2s1.1 1.6 2.5 2 2.5.8 2.5 2-1.1 2-2.5 2a2.5 2 0 0 1-2.5-1.5"/><path d="M12 6.5V8"/><path d="M12 16v1.5"/>',
    store: '<path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M2 7h20"/><path d="M22 7v3a2 2 0 0 1-2 2 2.7 2.7 0 0 1-2-1 2.7 2.7 0 0 1-4 0 2.7 2.7 0 0 1-4 0 2.7 2.7 0 0 1-4 0 2.7 2.7 0 0 1-2 1 2 2 0 0 1-2-2V7"/>',
    card: '<rect width="20" height="14" x="2" y="5" rx="2"/><path d="M2 10h20"/>',
    server: '<rect width="20" height="8" x="2" y="2" rx="2"/><rect width="20" height="8" x="2" y="14" rx="2"/><path d="M6 6h.01"/><path d="M6 18h.01"/>',
    refresh: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
    shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    swap: '<path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/>'
  };
  function ic(n, c) { return '<svg viewBox="0 0 24 24" fill="none" stroke="' + (c || 'currentColor') + '" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + I[n] + '</svg>'; }
  function ck(c) { return '<svg class="ck" viewBox="0 0 24 24" fill="none" stroke="' + c + '" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>'; }
  var B = 'oklch(0.52 0.19 262)', LB = 'oklch(0.75 0.13 259)';
  var YOU = [['users', 'Bringing in vendors'], ['trend', 'Marketing and buyers'], ['coin', 'Commissions and revenue']];
  var WE = [['store', 'Storefront built to your brand'], ['card', 'Payments, tax and payouts set up'], ['server', 'Hosting, CDN and search'], ['refresh', 'Updates tested before release'], ['shield', 'Backups, security and monitoring'], ['clock', 'Fixes within 1 hour when it matters']];
  var yH = '<div class="tag">You Focus On</div><h3 class="t">Growing the Marketplace</h3>';
  var wH = '<div class="tag lb">We Handle</div><h3 class="t">Everything Technical, End to End</h3>';
  var liC = function (x, c) { return '<li class="li">' + ck(c) + '<span>' + x[1] + '</span></li>'; };
  var liI = function (x, dark) { return '<li class="li"><span class="ic">' + ic(x[0]) + '</span><span>' + x[1] + '</span></li>'; };
  var V = [];

  V.push(['Stacked bands', 'Light strip for you, full-width dark band with six tiles for us',
    '<div class="v1"><div class="you lift">' + '<div>' + yH + '</div><ul>' + YOU.map(function (x) { return liC(x, B); }).join('') + '</ul></div>' +
    '<div class="we dark glow">' + wH + '<ul>' + WE.map(function (x) { return liI(x); }).join('') + '</ul></div></div>']);

  V.push(['Hand-off', 'Two equal halves joined by a hand-off node',
    '<div class="v2"><div class="you">' + yH + '<ul>' + YOU.map(function (x) { return liI(x); }).join('') + '</ul></div>' +
    '<div class="node" aria-hidden="true"><i>' + ic('swap') + '</i></div>' +
    '<div class="we dark glow">' + wH + '<ul>' + WE.map(function (x) { return liC(x, LB); }).join('') + '</ul></div></div>']);

  V.push(['Tile grid', 'Your focus on the left, every task we handle as its own tile',
    '<div class="v3"><div class="you">' + '<div>' + yH + '</div><ul>' + YOU.map(function (x) { return liI(x); }).join('') + '</ul></div>' +
    '<div class="grid"><div class="head dark glow">' + wH + '</div>' + WE.map(function (x) { return '<div class="tile"><span class="ic">' + ic(x[0]) + '</span><span>' + x[1] + '</span></div>'; }).join('') + '</div></div>']);

  V.push(['Diagonal split', 'One card, a slanted light panel cutting into the dark side, numbered list',
    '<div class="v4 dark glow"><div class="you">' + yH + '<ul>' + YOU.map(function (x) { return liC(x, B); }).join('') + '</ul></div>' +
    '<div class="we">' + wH + '<ol>' + WE.map(function (x) { return '<li>' + x[1] + '</li>'; }).join('') + '</ol></div></div>']);

  V.push(['Hub', 'Six spokes around a "We Handle" core',
    '<div class="v5"><div class="you">' + yH + '<ul>' + YOU.map(function (x) { return liC(x, B); }).join('') + '</ul></div>' +
    '<div class="hub dark glow"><div class="col l">' + WE.slice(0, 3).map(function (x) { return liI(x); }).join('') + '</div>' +
    '<div class="core">' + wH.replace('<h3 class="t">', '<h3>') + '</div>' +
    '<div class="col r">' + WE.slice(3).map(function (x) { return liI(x); }).join('') + '</div></div></div>']);

  V.push(['Side by side lists', 'Two headers, then each item as its own row, light for you and dark for us',
    '<div class="v6"><div class="heads"><div class="y">' + yH + '</div><div class="dark glow">' + wH + '</div></div>' +
    '<div class="rows"><ul>' + YOU.map(function (x) { return liI(x); }).join('') + '</ul><ul class="w">' + WE.map(function (x) { return liI(x); }).join('') + '</ul></div></div>']);


  V.push(['Big words', 'Oversized "You" and "We" set the split before the lists',
    '<div class="v7"><div class="you"><div class="word">You</div><div>' + yH + '</div><ul>' + YOU.map(function (x) { return liC(x, B); }).join('') + '</ul></div>' +
    '<div class="we dark glow"><div class="word">We</div><div>' + wH + '</div><ul>' + WE.map(function (x) { return liC(x, LB); }).join('') + '</ul></div></div>']);

  V.push(['One table', 'A single two-column table, the "We Handle" column dark',
    '<div class="v8"><div class="col you"><div class="hd">' + yH + '</div>' + YOU.map(function (x) { return '<div class="row"><span class="ic">' + ic(x[0]) + '</span>' + x[1] + '</div>'; }).join('') + '<div class="row empty">—</div><div class="row empty">—</div><div class="row empty">—</div></div>' +
    '<div class="col we dark"><div class="hd">' + wH + '</div>' + WE.map(function (x) { return '<div class="row"><span class="ic">' + ic(x[0]) + '</span>' + x[1] + '</div>'; }).join('') + '</div></div>']);

  V.push(['Layered cards', 'The dark card overlaps the light one, sliding a little on hover',
    '<div class="v9"><div class="you">' + yH + '<ul>' + YOU.map(function (x) { return liC(x, B); }).join('') + '</ul></div>' +
    '<div class="we dark glow">' + wH + '<ul>' + WE.map(function (x) { return liI(x); }).join('') + '</ul></div></div>']);

  V.push(['Counts', 'Big counts: 3 things for you, 6 things for us',
    '<div class="v10"><div class="you"><div class="num">3</div><div>' + yH + '</div><ul>' + YOU.map(function (x) { return liC(x, B); }).join('') + '</ul></div>' +
    '<div class="we dark glow"><div class="num">6</div><div>' + wH + '</div><ul>' + WE.map(function (x) { return liC(x, LB); }).join('') + '</ul></div></div>']);

  document.getElementById('v').innerHTML = V.map(function (v, i) {
    return '<section class="var"><div class="vh"><b><span class="lab">Variation ' + (i + 1) + '</span><br>' + v[0] + '</b><span>' + v[1] + '</span></div>' + v[2] + '</section>';
  }).join('');
  /* glow follows nothing on touch; on desktop it drifts on hover via CSS */
})();
</script>
</body>
</html>
