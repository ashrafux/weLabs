<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pricing Card — 10 Variations</title>
<style>
@font-face{font-family:'Manrope WL';font-weight:200 800;font-display:swap;src:url(https://welabs.dev/fonts/Manrope-variable-latin.woff2) format('woff2')}
@font-face{font-family:'Geist WL';font-weight:100 900;font-display:swap;src:url(https://welabs.dev/fonts/Geist-variable-latin.woff2) format('woff2')}
@font-face{font-family:'Plex WL';font-weight:500;font-display:swap;src:url(https://welabs.dev/fonts/IBMPlexMono-500-latin.woff2) format('woff2')}
@font-face{font-family:'Plex WL';font-weight:600;font-display:swap;src:url(https://welabs.dev/fonts/IBMPlexMono-600-latin.woff2) format('woff2')}
:root{--ink:#111B3A;--ink2:#3A4566;--muted:#4A5268;--soft:#5E6680;--line:#E6E8EF;--bg:oklch(0.966 0.011 259);--bg2:oklch(0.985 0.008 262);
  --blue:oklch(0.52 0.19 262);--blue-soft:oklch(0.955 0.025 262);--lb:oklch(0.75 0.13 259);--green:oklch(0.42 0.12 155);--green-bg:oklch(0.94 0.05 155);--amber:oklch(0.45 0.12 60);--amber-bg:oklch(0.96 0.04 75)}
*{box-sizing:border-box}
body{margin:0;background:#FFFFFF;color:var(--ink);font-family:'Geist WL',sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
h2,h3,h4{font-family:'Manrope WL',sans-serif;margin:0;color:var(--ink)}
p{margin:0}ul{list-style:none;margin:0;padding:0}
.wrap{max-width:1360px;margin:0 auto;padding:0 32px}
.top{padding:80px 0 8px;text-align:center}
.top .eb{font-family:'Plex WL',monospace;font-size:13px;color:var(--blue)}
.top h1{margin:14px 0 0;font-family:'Manrope WL',sans-serif;font-size:clamp(28px,3.2vw,48px);line-height:1.08;letter-spacing:-.032em;font-weight:700}
.top h1 span{display:block;font-weight:300;color:var(--ink2)}
.var{padding:64px 0}.var+.var{border-top:1px solid var(--line)}
.vh{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:28px}
.vh b{font-family:'Manrope WL',sans-serif;font-size:22px;font-weight:700;letter-spacing:-.02em}
.vh small{display:block;font-family:'Plex WL',monospace;font-size:13px;color:var(--blue);font-weight:500}
.vh span{font-size:15px;color:var(--soft);text-align:right;max-width:520px}
/* atoms */
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-family:'Plex WL',monospace;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--amber-bg);color:var(--amber)}
.badge.g{background:var(--green-bg);color:var(--green)}
.badge.d{background:var(--ink);color:#FFFFFF}
.name{font-size:23px;font-weight:700;letter-spacing:-.02em}
.for{font-size:15px;color:var(--muted)}
.big{font-family:'Manrope WL',sans-serif;font-size:50px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.unit{font-size:15px;font-weight:600;color:var(--muted)}
.was{font-family:'Manrope WL',sans-serif;font-size:18px;font-weight:600;color:var(--soft);text-decoration:line-through}
.price{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.term{font-size:14px;color:var(--soft)}
.after{font-size:13.5px;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 26px;border-radius:12px;background:var(--blue);color:#FFFFFF;font-weight:600;font-size:15.5px;text-decoration:none;box-shadow:0 12px 24px -12px oklch(0.52 0.19 262 / .6);transition:background-color .2s}
.btn:hover{background:var(--ink)}
.btn.pill{border-radius:999px}.btn.dark{background:var(--ink);box-shadow:none}.btn.dark:hover{background:var(--blue)}.btn.white{background:#FFFFFF;color:var(--ink);box-shadow:none}
.bd{border:1px solid var(--line);border-radius:14px;background:#FFFFFF;padding:0 16px}
.bd li{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px;color:var(--muted)}
.bd li:last-child{border-bottom:0}.bd s{font-size:13.5px;color:var(--soft);margin-right:6px}.bd b{color:var(--ink)}
.lab{font-family:'Plex WL',monospace;font-size:13px;font-weight:500;color:var(--blue)}
.grp h4{font-size:15.5px;font-weight:700;margin-bottom:10px}
.grp ul{display:grid;gap:9px}
.grp li,.fl li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;font-weight:500;line-height:1.5}
.ck{width:16px;height:16px;flex:none;margin-top:3px}
.tag{flex:none;align-self:center;padding:2px 7px;border-radius:999px;background:var(--green-bg);color:var(--green);font-family:'Plex WL',monospace;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.dark,.dark h3,.dark h4,.dark .name,.dark .big{color:#FFFFFF}
.dark .for,.dark .term,.dark .after,.dark .unit{color:#B9C3E3}
.dark .grp li{color:#E3E8FB}
.card{border:1px solid var(--line);border-radius:24px;background:#FFFFFF}
.g4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 32px}
/* V1 */
.v1{display:grid;grid-template-columns:400px minmax(0,1fr);border:2px solid var(--blue);border-radius:22px;overflow:hidden}
.v1 .l{padding:36px 32px;background:var(--bg2);border-right:1px solid var(--line);display:grid;gap:14px;align-content:start}
.v1 .r{padding:36px}
.v1 .r .lab{display:block;margin-bottom:22px}
/* V2 */
.v2{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px}
.v2 .r{border-radius:24px;padding:36px;background:var(--ink);position:relative;overflow:hidden;display:grid;gap:14px;align-content:start}
.v2 .r::before{content:"";position:absolute;width:420px;height:420px;right:-160px;top:-180px;border-radius:50%;background:radial-gradient(closest-side,oklch(0.52 0.19 262 / .6),transparent)}
.v2 .r>*{position:relative}
.v2 .r .bd{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12)}.v2 .r .bd li{color:#B9C3E3;border-color:rgba(255,255,255,.1)}.v2 .r .bd b{color:#FFFFFF}
.v2 .l{border-radius:24px;padding:36px;background:var(--bg)}
.v2 .l .lab{display:block;margin-bottom:22px}
/* V3 */
.v3 .head{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:32px;padding:28px 32px;border-radius:24px 24px 0 0;background:var(--ink)}
.v3 .head .bd{display:flex;gap:0;padding:0;background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12)}
.v3 .head .bd li{flex-direction:column;gap:2px;padding:10px 18px;border:0;border-right:1px solid rgba(255,255,255,.1);color:#B9C3E3;font-size:12.5px}
.v3 .head .bd li:last-child{border-right:0}.v3 .head .bd b{color:#FFFFFF;font-size:15px}
.v3 .body{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;padding:32px;border:1px solid var(--line);border-top:0;border-radius:0 0 24px 24px}
/* V4 */
.v4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 360px;gap:12px}
.v4 .grp{border-radius:20px;padding:24px;background:var(--bg)}
.v4 .price-c{grid-row:span 1;border-radius:20px;padding:28px;border:2px solid var(--blue);display:grid;gap:12px;align-content:start}
/* V5 */
.v5{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.v5 .ticket{position:relative;border-radius:24px;padding:36px;background:var(--bg);display:grid;gap:16px;align-content:start}
.v5 .ticket::after{content:"";position:absolute;left:24px;right:24px;top:200px;border-top:2px dashed #CFD4E0}
.v5 .ticket .big{font-size:72px}
.v5 .ticket .sp{height:22px}
.v5 .r{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.v5 .r .grp{border:1px solid var(--line);border-radius:20px;padding:22px}
/* V6 */
.v6{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:48px;align-items:start}
.v6 .stk{position:sticky;top:24px;display:grid;gap:14px;padding:32px;border-radius:24px;background:#FFFFFF;border:1px solid var(--line);box-shadow:0 30px 60px -40px rgba(17,27,58,.35)}
.v6 .list{display:grid;gap:0}
.v6 .list .grp{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;padding:24px 0;border-top:1px solid var(--line)}
.v6 .list .grp:first-child{border-top:0;padding-top:0}
.v6 .list .grp ul{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:20px}
/* V7 */
.v7{border-radius:28px;background:var(--ink);padding:16px;display:grid;grid-template-columns:420px minmax(0,1fr);gap:16px}
.v7 .l{padding:32px;display:grid;gap:14px;align-content:start}
.v7 .l .bd{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12)}.v7 .l .bd li{color:#B9C3E3;border-color:rgba(255,255,255,.1)}.v7 .l .bd b{color:#FFFFFF}
.v7 .r{border-radius:20px;background:#FFFFFF;padding:32px}
.v7 .r .lab{display:block;margin-bottom:22px}
/* V8 */
.v8{text-align:center}
.v8 .hero{display:grid;justify-items:center;gap:12px;padding:44px 32px;border-radius:24px 24px 0 0;background:linear-gradient(180deg,var(--blue-soft),#FFFFFF);border:1px solid var(--line);border-bottom:0}
.v8 .hero .big{font-size:72px}
.v8 .hero .row{display:flex;gap:12px;align-items:center;margin-top:8px}
.v8 .hero .bd{display:flex;padding:0;margin-top:8px}.v8 .hero .bd li{flex-direction:column;padding:10px 22px;border:0;border-right:1px solid var(--line);font-size:12.5px}.v8 .hero .bd li:last-child{border-right:0}
.v8 .feat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;padding:32px;border:1px solid var(--line);border-top:1px dashed #CFD4E0;border-radius:0 0 24px 24px;text-align:left}
/* V9 */
.v9{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:auto auto;gap:12px}
.v9 .t{border-radius:20px;padding:26px}
.v9 .price-t{grid-row:span 2;background:var(--ink);display:grid;gap:14px;align-content:start;padding:32px;border-radius:24px}
.v9 .price-t .bd{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12)}.v9 .price-t .bd li{color:#B9C3E3;border-color:rgba(255,255,255,.1)}.v9 .price-t .bd b{color:#FFFFFF}
.v9 .t.c1{background:var(--blue-soft)}.v9 .t.c2{background:var(--green-bg)}.v9 .t.c3{background:var(--amber-bg)}.v9 .t.c4{background:oklch(0.95 0.025 300)}
/* V10 */
.v10{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:24px;overflow:hidden}
.v10 .stage{padding:40px;background:var(--bg2);display:grid;gap:22px;align-content:start;border-right:1px solid var(--line)}
.v10 .tl{display:grid;gap:0}
.v10 .tl div{display:grid;grid-template-columns:28px 1fr auto;gap:14px;align-items:center;padding:14px 0;position:relative}
.v10 .tl div::before{content:"";position:absolute;left:13px;top:0;bottom:0;border-left:2px solid #CFD4E0}
.v10 .tl div:first-child::before{top:50%}.v10 .tl div:last-child::before{bottom:50%}
.v10 .tl i{position:relative;width:28px;height:28px;border-radius:50%;background:#FFFFFF;border:2px solid var(--blue)}
.v10 .tl div:first-child i{background:var(--blue)}
.v10 .tl span{font-size:14.5px;color:var(--muted)}.v10 .tl b{font-size:15px}.v10 .tl s{font-size:13.5px;color:var(--soft);margin-right:6px}
.v10 .r{padding:40px}
.v10 .r .lab{display:block;margin-bottom:22px}
.badge{justify-self:start;width:max-content}
.v8 .hero .badge{justify-self:center}
.v7 .r,.v7 .r h4{color:var(--ink)}
.v7 .r .grp li{color:var(--ink)}
@media (max-width:1100px){
  .v1,.v2,.v5,.v6,.v7,.v10{grid-template-columns:minmax(0,1fr)}
  .v4{grid-template-columns:repeat(2,minmax(0,1fr))}.v4 .price-c{grid-column:1/-1}
  .v3 .body,.v8 .feat{grid-template-columns:repeat(2,minmax(0,1fr))}
  .v3 .head{grid-template-columns:1fr}
  .v9{grid-template-columns:repeat(2,minmax(0,1fr))}.v9 .price-t{grid-column:1/-1;grid-row:auto}
  .v6 .stk{position:static}
  .v1 .l,.v10 .stage{border-right:0;border-bottom:1px solid var(--line)}
}
@media (max-width:700px){
  .wrap{padding:0 20px}.vh{flex-direction:column}.vh span{text-align:left}
  .g4,.v3 .body,.v8 .feat,.v4,.v5 .r,.v9,.v6 .list .grp,.v6 .list .grp ul{grid-template-columns:minmax(0,1fr)}
  .v3 .head .bd,.v8 .hero .bd{flex-direction:column}.v3 .head .bd li,.v8 .hero .bd li{border-right:0;border-bottom:1px solid var(--line)}
  .v5 .ticket::after{display:none}
}
</style>
</head>
<body>
<header class="top wrap"><div class="eb">Pricing card</div><h1>One Plan, Everything Included<span>Ten Layout Variations</span></h1></header>
<main class="wrap" id="v"></main>
<script>
(function(){
  var B='oklch(0.52 0.19 262)',LB='oklch(0.75 0.13 259)';
  function ck(c){return '<svg class="ck" viewBox="0 0 24 24" fill="none" stroke="'+(c||B)+'" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';}
  var G=[['Build & Launch',[['Branded headless storefront'],['Live in 20 business days','Guaranteed'],['30 hours of customization','Doubled'],['All Dokan Pro modules and license']]],
         ['Hosting & Speed',[['90+ Lighthouse score','Guaranteed'],['Managed hosting, CDN and SSL'],['Fast search for 50K products'],['Readable by AI shopping assistants','New']]],
         ['Care & Support',[['1-hour critical response, 24/7'],['99.9% uptime SLA'],['Tested updates and daily backups'],['Dedicated account manager']]],
         ['Growth & Ownership',[['3 hours of changes every month'],['Monthly reports, quarterly review'],['0% revenue share'],['You own your data and code']]]];
  function grp(g,c){return '<div class="grp"><h4>'+g[0].replace('&','&amp;')+'</h4><ul>'+g[1].map(function(x){return '<li>'+ck(c)+'<span>'+x[0]+(x[1]?' <span class="tag">'+x[1]+'</span>':'')+'</span></li>';}).join('')+'</ul></div>';}
  var groups=function(c){return G.map(function(g){return grp(g,c);}).join('');};
  var name='<h3 class="name">Managed Dokan</h3>';
  var badge='<span class="badge">Black Friday Deal</span>';
  var forT='<p class="for">For marketplaces up to 500K monthly visits.</p>';
  var price='<div class="price"><span class="big">$2,999</span><span class="unit">/first year</span><span class="was">$8,088</span><span class="badge g">Save 63%</span></div>';
  var term='<p class="term">Onboarding and 12 months, billed upfront</p>';
  var cta=function(cls){return '<a href="#" class="btn '+(cls||'')+'">Claim My Slot →</a>';};
  var after='<p class="after">Only 10 founding slots. Lock it by Dec 1, start by May 31, 2027.</p>';
  var bd='<ul class="bd"><li><span>Onboarding</span><span><s>$3,900</s><b>$1,499</b></span></li><li><span>First 12 months</span><span><s>$4,188</s><b>$1,500</b></span></li><li><span>After year one</span><span><s>$349</s><b>$299/mo</b></span></li></ul>';
  var lock='<p class="after">$299/mo locked for life. Month to month after year one.</p>';
  var inc='<span class="lab">What\'s included</span>';
  var stack=name+badge+forT+price+term+cta()+after+bd+lock;
  var V=[
   ['Classic split','Today\'s layout: price panel left, four feature groups right','<div class="v1"><div class="l">'+stack+'</div><div class="r">'+inc+'<div class="g4">'+groups()+'</div></div></div>'],
   ['Dark price panel on the right','Features first on a light panel, the price card dark with a glow','<div class="v2"><div class="l">'+inc+'<div class="g4">'+groups()+'</div></div><div class="r dark">'+name+badge+forT+price+term+cta('white')+after+bd+lock+'</div></div>'],
   ['Price bar on top','A dark horizontal price bar, features in four columns below','<div class="v3"><div class="head dark"><div>'+name+'<div style="margin-top:6px">'+badge+'</div></div><div><div class="price"><span class="big">$2,999</span><span class="unit">/first year</span><span class="was">$8,088</span></div>'+term+'</div><div style="display:grid;gap:10px;justify-items:end">'+cta('white pill')+'</div></div><div class="body">'+groups()+'</div></div>'],
   ['Feature tiles + price column','Each feature group is its own tile, the price card sits as the fifth column','<div class="v4">'+G.map(function(g){return grp(g);}).join('')+'<div class="price-c">'+name+badge+price+term+cta()+after+'</div></div>'],
   ['Ticket','A ticket-style price card with a tear line, groups in tiles on the right','<div class="v5"><div class="ticket">'+name+'<div>'+badge+'</div>'+forT+'<div class="sp"></div>'+price+term+cta('pill')+after+bd+'</div><div class="r">'+groups()+'</div></div>'],
   ['Sticky price card','Long feature list on the left, a raised price card that stays in view','<div class="v6"><div class="list">'+G.map(function(g){return '<div class="grp"><h4>'+g[0].replace('&','&amp;')+'</h4><ul>'+g[1].map(function(x){return '<li>'+ck()+'<span>'+x[0]+(x[1]?' <span class="tag">'+x[1]+'</span>':'')+'</span></li>';}).join('')+'</ul></div>';}).join('')+'</div><div class="stk">'+stack+'</div></div>'],
   ['Dark frame','The whole plan inside a dark frame, features on a white inset card','<div class="v7 dark"><div class="l">'+name+badge+forT+price+term+cta('white')+after+bd+'</div><div class="r">'+inc+'<div class="g4">'+groups()+'</div></div></div>'],
   ['Centred price hero','Big centred price with the breakdown inline, features underneath','<div class="v8"><div class="hero">'+badge+name+'<div class="price" style="justify-content:center"><span class="big">$2,999</span><span class="unit">/first year</span></div><div class="row"><span class="was">$8,088</span><span class="badge g">Save 63%</span></div>'+term+'<div style="width:280px;margin-top:8px">'+cta('pill')+'</div><ul class="bd"><li><span>Onboarding</span><b>$1,499</b></li><li><span>First 12 months</span><b>$1,500</b></li><li><span>After year one</span><b>$299/mo</b></li></ul></div><div class="feat">'+groups()+'</div></div>'],
   ['Bento','A tall dark price tile with four coloured feature tiles around it','<div class="v9"><div class="price-t dark">'+name+badge+price+term+cta('white')+after+bd+'</div>'+G.map(function(g,k){return '<div class="t c'+(k+1)+'">'+grp(g)+'</div>';}).join('')+'</div>'],
   ['Price timeline','The price path drawn as a timeline: onboarding, year one, after year one','<div class="v10"><div class="stage">'+name+badge+price+'<div class="tl"><div><i></i><span>Onboarding</span><span><s>$3,900</s><b>$1,499</b></span></div><div><i></i><span>First 12 months</span><span><s>$4,188</s><b>$1,500</b></span></div><div><i></i><span>After year one</span><span><s>$349</s><b>$299/mo</b></span></div></div>'+cta()+after+'</div><div class="r">'+inc+'<div class="g4">'+groups()+'</div></div></div>']
  ];
  document.getElementById('v').innerHTML=V.map(function(v,i){return '<section class="var" id="p'+(i+1)+'"><div class="vh"><b><small>Variation '+(i+1)+'</small>'+v[0]+'</b><span>'+v[1]+'</span></div>'+v[2]+'</section>';}).join('');
})();
</script>
</body>
</html>
